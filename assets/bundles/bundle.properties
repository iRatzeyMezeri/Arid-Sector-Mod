#Buildable
block.arid-sector-transport-duct.name = Resilient Duct
block.arid-sector-transport-duct.description = Transports Items forward.
block.arid-sector-resilient-junction.name = Resilient Junction
block.arid-sector-resilient-junction.description = Transports Items on the Vertical and Horizontal connections separately.
block.arid-sector-resilient-router.name = Resilient Router
block.arid-sector-resilient-router.description = Splits flow of items into up to three directions. Can function as a sorter.
block.arid-sector-resilient-overflow-duct.name = Resilient Overflow Gate
block.arid-sector-resilient-overflow-duct.description = Outputs items to the sides only if the front path is blocked.
block.arid-sector-resilient-underflow-duct.name = Resilient Underflow Gate
block.arid-sector-resilient-underflow-duct.description = Outputs items to the front only if the side paths are blocked.
block.arid-sector-resilient-bridge.name = Resilient Bridge
block.arid-sector-resilient-bridge.description = Transport Items over walls and structures.
block.arid-sector-resilient-unloader.name = Resilient Unloader
block.arid-sector-resilient-unloader.description = Takes Items from containers or factories and outputs them forward.

block.arid-sector-clay-grinder.name = Clay Grinder
block.arid-sector-clay-grinder.description = Slowly extracts Clay out of the ground.
block.arid-sector-clay-extractor.name = Clay Extractor
block.arid-sector-clay-extractor.description = Extracts Clay out of walls. Extraction Speed is dependent on the clay concentration in the wall material.
block.arid-sector-hydrocarbon-bore.name = Hydrocarbon Bore
block.arid-sector-hydrocarbon-bore.description = 3x3 oil fueled structure that mines ore from walls using beams. Requires Power.

block.arid-sector-vent-delver.name = Vent Delver
block.arid-sector-vent-delver.description = Produces Power out of the geothermal activity in the vents of the [#704036]Arid Sector[].

block.arid-sector-vent-rig.name = Vent Rig
block.arid-sector-vent-rig.description = Pumps ancient remains of biological material from the vents of the [#704036]Arid Sector[] as oil.

block.arid-sector-amp.name = Amp
block.arid-sector-amp.description = Primary Defense Structure of the [accent]Reclamation Plan[]. Shoots out two charged rods in an acceptable range that shocks enemies on contact.
block.arid-sector-atmos.name = Atmos
block.arid-sector-atmos.description = Ground Artillery Turret that launches heavy shells at enemies.

block.arid-sector-core-occupation.name = Core: Occupation
block.arid-sector-core-occupation.description = Fundamental Core of the [accent]Reclamation Plan[]. Equipped with minimal storage, unit control tower and the "Tenant" Overseer Unit.
#Units
unit.arid-sector-tenant.name = Tenant
unit.arid-sector-tenant.description = Basic Reclamation Unit overseeing the "Occupation" Core. Equipped with two repair beams and one mining beam. Is Detectable by enemies.
#Items
item.arid-sector-magnesium.name = Aluminium
item.arid-sector-magnesium.description = Lightweight conductive metal found commonly on the surface of the [#704036]Arid Sector[].
item.arid-sector-item-clay.name = Clay
item.arid-sector-item-clay.description = Piles of Sediment collected over time on the surface or inside the walls on the [#704036]Arid Sector[]. Just durable enough to withstand the hostile coditions of the planet and be used in construction.
item.arid-sector-carapace.name = Carapace
item.arid-sector-carapace.description = Reconstructed silicon exoskeletons of past inhabitants of the [#704036]Arid Sector[].

