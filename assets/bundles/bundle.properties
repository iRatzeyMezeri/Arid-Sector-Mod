#Buildable
block.arid-sector-basic-roadway.name = Basic Roadway
block.arid-sector-basic-roadway.description = Basic Clay roadway that transports items forwards in stacks of 4.
block.arid-sector-roadway-junction.name = Roadway Junction
block.arid-sector-roadway-junction.description = Transports Items on the Vertical and Horizontal connections separately.
block.arid-sector-roadway-router.name = Roadway Router
block.arid-sector-roadway-router.description = Splits flow of items into up to three directions. Can function as a sorter.
block.arid-sector-overflow-roadway.name = Overflow Roadway
block.arid-sector-overflow-roadway.description = Outputs items to the sides only if the front path is blocked.
block.arid-sector-underflow-roadway.name = Underflow Roadway
block.arid-sector-underflow-roadway.description = Outputs items to the front only if the side paths are blocked.
block.arid-sector-roadway-bridge.name = Roadway Bridge
block.arid-sector-roadway-bridge.description = Transport Items over walls and structures.
block.arid-sector-roadway-unloader.name = Roadway Unloader
block.arid-sector-roadway-unloader.description = Takes Items from containers or factories and outputs them forward.

block.arid-sector-clay-grinder.name = Clay Grinder
block.arid-sector-clay-grinder.description = Slowly extracts Clay out of the ground.
block.arid-sector-clay-extractor.name = Clay Extractor
block.arid-sector-clay-extractor.description = Extracts Clay out of walls. Extraction Speed is dependent on the clay concentration in the wall material.
block.arid-sector-hydrocarbon-bore.name = Hydrocarbon Bore
block.arid-sector-hydrocarbon-bore.description = 3x3 oil fueled structure that mines ore from walls using beams. Requires Power.

block.arid-sector-vent-delver.name = Vent Delver
block.arid-sector-vent-delver.description = Produces Power out of the geothermal activity in the vents of the [#704036]Arid Sector[].
block.arid-sector-aluminium-node.name = Aluminium Node
block.arid-sector-aluminium-node.description = Transmits power to nearby nodes.
block.arid-sector-aluminium-battery.name = Aluminium Battery
block.arid-sector-aluminium-battery.description = Stores unused power.
block.arid-sector-aluminium-diode.name = Aluminium Diode
block.arid-sector-aluminium-diode.description = Transmits power forwards from one battery to another if and only if the battery in the front has less power stored in it. [#50b2aa] Use this to separate grids that produce power using power to prevent a positive feedback loop of your power plants producing less power. [#61338f] Yeah most trainees dont understand this either. []
block.arid-sector-natural-fuel-generator.name = Natural Fuel Burner
block.arid-sector-natural-fuel-generator.description = Burns oil to produce electric power. Wears down the aluminium wiring easily.

block.arid-sector-vent-rig.name = Vent Rig
block.arid-sector-vent-rig.description = Pumps ancient remains of biological material from the vents of the [#704036]Arid Sector[] as oil.
block.arid-sector-drainway.name = Drainway
block.arid-sector-drainway.description = Moves liquids forward.
block.arid-sector-drainway-junction.name = Drainway Junction
block.arid-sector-drainway-junction.description = Moves Liquids on the Vertical and Horizontal connections separately.
block.arid-sector-drainway-router.name = Drainway Router
block.arid-sector-drainway-router.description = Splits Liquid flow evenly. Serves as a minor liquid storage unit.
block.arid-sector-drainway-bridge.name = Drainway Bridge
block.arid-sector-drainway-bridge.description = Transports liquids over walls and structures.
block.arid-sector-resilient-liquid-container.name = Resilient Liquid Container
block.arid-sector-resilient-liquid-container.description = Stores Liquids.

block.arid-sector-amp.name = Amp
block.arid-sector-amp.description = Primary Defense Structure of the [accent]Reclamation Plan[]. Shoots out two charged rods in an acceptable range that shocks enemies on contact. Requires Power.
block.arid-sector-atmos.name = Atmos
block.arid-sector-atmos.description = Ground Artillery Turret that launches heavy shells at enemies.

block.arid-sector-biomaterial-reconstruction-bed.name = Biomaterial Restoration Bed
block.arid-sector-biomaterial-reconstruction-bed.description = Restores fragments of silicon exoskeletons cemented in the oil found deep within the [#704036]Arid Sector[].

block.arid-sector-serf-constructor.name = Serf Constructor
block.arid-sector-serf-constructor.description = Constructs "Serf" Walker units.
block.arid-sector-pioneer-constructor.name = Pioneer Constructor
block.arid-sector-pioneer-constructor.description = Constructs "Pioneer" Scout units.

block.arid-sector-brittle-wall.name = Brittle Wall
block.arid-sector-brittle-wall.description = Basic Clay Wall to protect your less important structures. [#61338f] They should all be important[]. Reccomended Switching to Carapace Walls as soon as possible.
block.arid-sector-large-brittle-wall.name = Large Brittle Wall
block.arid-sector-large-brittle-wall.description = Basic 2x2 Clay Wall to protect your less important structures. [#61338f] They should all be important[]. Reccomended Switching to Carapace Walls as soon as possible.
block.arid-sector-carapace-wall.name = Carapace Wall
block.arid-sector-carapace-wall.description = A stronger defensive wall made out of restored biomaterial.
block.arid-sector-large-carapace-wall.name = Carapace Wall
block.arid-sector-large-carapace-wall.description = A stronger 2x2 defensive wall made out of restored biomaterial.

block.arid-sector-core-occupation.name = Core: Claim
block.arid-sector-core-occupation.description = Fundamental Core of the [accent]Reclamation Plan[]. Equipped with minimal storage, unit control tower and the "Tenant" Overseer Unit.
block.arid-sector-resilient-container.name = Resilient Container
block.arid-sector-resilient-container.description = Stores Items.

#Units
unit.arid-sector-tenant.name = Tenant
unit.arid-sector-tenant.description = Basic Reclamation Unit overseeing the "Occupation" Core. Equipped with two repair beams and one mining beam. Is Detectable by enemies.
unit.arid-sector-serf.name = Serf
unit.arid-sector-serf.description = Fundamental Walker-Type Fighter Unit. Armed with two Instant Laser Rifles that damage both ground and aerial targets.
unit.arid-sector-pioneer.name = Pioneer
unit.arid-sector-pioneer.description = Primary Scout Unit of the [accent]Reclamation Plan[] based on the remains of ancient lifeforms. Built to move at fast speeds and potentially damage undefended structure but not to withstand proper warfare.
unit.arid-sector-thriller.name = Thriller
unit.arid-sector-thriller.description = Aerial Unit armed with an Oil and Slag tank that connect and cause a violent explosion when activated.
unit.arid-sector-bulk.name = Warden
unit.arid-sector-bulk.description = Mech Unit armed with a frontal shield projector and an artillery cannon.
#Items
item.arid-sector-magnesium.name = Aluminium
item.arid-sector-magnesium.description = Lightweight conductive metal found commonly on the surface of the [#704036]Arid Sector[].
item.arid-sector-item-clay.name = Clay
item.arid-sector-item-clay.description = Piles of Sediment collected over time on the surface or inside the walls on the [#704036]Arid Sector[]. Just durable enough to withstand the hostile coditions of the planet and be used in construction.
item.arid-sector-carapace.name = Carapace
item.arid-sector-carapace.description = Reconstructed silicon exoskeletons of past inhabitants of the [#704036]Arid Sector[].

